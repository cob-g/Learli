name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: learli_owner
          # Synthetic credential for this disposable loopback CI service only.
          POSTGRES_PASSWORD: local-disposable-ci-only
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U learli_owner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: node scripts/ci-db.mjs
        env:
          LOCAL_CI_OWNER_PASSWORD: local-disposable-ci-only
      - run: npm run db:migrate:test
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-check-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
